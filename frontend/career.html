<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HireFlow — Careers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/career.css" />
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────── -->
  <header class="career-header">
    <a href="/" class="career-logo">HireFlow Careers</a>
  </header>

  <!-- ── Body layout: sidebar + main ──────────────────────────── -->
  <div class="career-layout">

    <!-- Left sidebar: dropdown filters -->
    <aside class="career-sidebar">

      <div class="career-filter-group">
        <label class="career-filter-label" for="filter-location-type">Location type</label>
        <div class="career-select-wrap">
          <select id="filter-location-type" class="career-select">
            <option value="">All</option>
            <option value="on-site">On-site</option>
            <option value="hybrid">Hybrid</option>
            <option value="remote">Remote</option>
          </select>
          <i data-lucide="chevron-down" class="career-select-icon" aria-hidden="true"></i>
        </div>
      </div>

      <div class="career-filter-group">
        <label class="career-filter-label" for="filter-location">Location</label>
        <div class="career-select-wrap">
          <select id="filter-location" class="career-select">
            <option value="">All</option>
            <!-- Populated by JS from API data -->
          </select>
          <i data-lucide="chevron-down" class="career-select-icon" aria-hidden="true"></i>
        </div>
      </div>

      <div class="career-filter-group">
        <label class="career-filter-label" for="filter-team">Team</label>
        <div class="career-select-wrap">
          <select id="filter-team" class="career-select">
            <option value="">All</option>
            <!-- Populated by JS from API data -->
          </select>
          <i data-lucide="chevron-down" class="career-select-icon" aria-hidden="true"></i>
        </div>
      </div>

      <div class="career-filter-group">
        <label class="career-filter-label" for="filter-work-type">Work type</label>
        <div class="career-select-wrap">
          <select id="filter-work-type" class="career-select">
            <option value="">All</option>
            <option value="Full-Time">Full-Time</option>
            <option value="Part-Time">Part-Time</option>
            <option value="Contract">Contract</option>
            <option value="Contract Remote">Contract Remote</option>
            <option value="Internship">Internship</option>
          </select>
          <i data-lucide="chevron-down" class="career-select-icon" aria-hidden="true"></i>
        </div>
      </div>

    </aside>

    <!-- Right: search + grouped job list -->
    <main class="career-main">
      <div class="career-search-bar">
        <div class="career-search-wrap">
          <i data-lucide="search" class="career-search-icon" aria-hidden="true"></i>
          <input
            id="search"
            type="text"
            class="career-search"
            placeholder="Search roles…"
            aria-label="Search roles"
          />
        </div>
      </div>

      <div id="jobs-container" class="career-jobs-list" aria-live="polite">
        <p class="career-empty">Loading positions…</p>
      </div>
    </main>
  </div>

  <!-- ── Job Detail modal ────────────────────────────────────── -->
  <div id="job-detail-modal" class="career-modal-overlay" hidden aria-modal="true" role="dialog">
    <div class="career-modal career-detail-modal">
      <div class="career-modal-header">
        <div>
          <h2 class="career-modal-title" id="detail-job-title"></h2>
          <p class="career-modal-subtitle" id="detail-job-meta"></p>
          <p class="career-detail-salary" id="detail-job-salary" hidden></p>
        </div>
        <button class="career-modal-close" id="detail-modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="career-detail-body" id="detail-job-desc"></div>
      <div class="career-detail-footer">
        <button type="button" class="career-btn-primary" id="detail-apply-btn">Apply for this Role</button>
      </div>
    </div>
  </div>

  <!-- ── Apply modal ─────────────────────────────────────────── -->
  <div id="apply-modal" class="career-modal-overlay" hidden aria-modal="true" role="dialog">
    <div class="career-modal">
      <div class="career-modal-header">
        <div>
          <h2 class="career-modal-title" id="modal-job-title">Apply for Position</h2>
          <p class="career-modal-subtitle" id="modal-job-meta"></p>
        </div>
        <button class="career-modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>

      <div id="apply-form-wrap">
        <form id="apply-form" class="career-form" novalidate>
          <div class="career-form-row">
            <div class="career-field">
              <label class="career-label" for="app-name">Full Name *</label>
              <input type="text" id="app-name" class="career-input" required autocomplete="name" />
            </div>
            <div class="career-field">
              <label class="career-label" for="app-email">Email *</label>
              <input type="email" id="app-email" class="career-input" required autocomplete="email" />
            </div>
          </div>
          <div class="career-form-row">
            <div class="career-field">
              <label class="career-label" for="app-phone">Phone</label>
              <input type="tel" id="app-phone" class="career-input" autocomplete="tel" />
            </div>
            <div class="career-field">
              <label class="career-label" for="app-linkedin">LinkedIn URL</label>
              <input type="url" id="app-linkedin" class="career-input" placeholder="https://linkedin.com/in/…" />
            </div>
          </div>
          <div class="career-field">
            <label class="career-label" for="app-resume">
              Resume <span class="career-label-hint">(PDF or DOCX, max 5 MB)</span>
            </label>
            <input type="file" id="app-resume" class="career-input" accept=".pdf,.docx,.doc" />
          </div>
          <div class="career-field">
            <label class="career-label" for="app-cover">Cover Letter</label>
            <textarea id="app-cover" class="career-textarea" rows="5" placeholder="Tell us why you're a great fit…"></textarea>
          </div>
          <div id="apply-error" class="career-error" hidden role="alert"></div>
          <div class="career-form-actions">
            <button type="button" class="career-btn-secondary" id="cancel-apply">Cancel</button>
            <button type="submit" class="career-btn-primary" id="submit-apply">Submit Application</button>
          </div>
        </form>
      </div>

      <div id="apply-success" class="career-success" hidden>
        <div class="career-success-icon">✓</div>
        <h3>Application Submitted!</h3>
        <p>Thanks for applying. We'll review your application and be in touch soon.</p>
        <button class="career-btn-primary" id="success-close">Done</button>
      </div>
    </div>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────── -->
  <footer class="career-footer">
    <a href="/" class="career-footer-link">Shyftlabs Home Page</a>
    <span class="career-footer-sep">·</span>
    <span>Jobs powered by HireFlow</span>
  </footer>

  <script type="module" src="/js/pages/career.js"></script>
</body>
</html>
