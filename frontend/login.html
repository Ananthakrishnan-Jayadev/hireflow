<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Sign In — HireFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 50%, #9a3412 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-mark {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #ea580c, #f97316);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .logo-mark svg { width: 26px; height: 26px; color: #fff; }

    .logo-name {
      font-size: 22px;
      font-weight: 700;
      color: #1a1d21;
      letter-spacing: -0.3px;
    }

    .logo-tagline {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1d21;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1d21;
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: #ea580c;
      box-shadow: 0 0 0 3px rgba(234,88,12,0.12);
    }

    input.error { border-color: #ef4444; }

    .error-msg {
      font-size: 12px;
      color: #ef4444;
      margin-top: 5px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: #ea580c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-login:hover { background: #c2410c; }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo-area">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </div>
    <div class="logo-name">HireFlow</div>
    <div class="logo-tagline">AI-Powered Recruitment Platform</div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your recruiter account</p>

  <div class="alert error" id="login-error" role="alert">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px;">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="login-error-text"></span>
  </div>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@company.com"
             autocomplete="email" autofocus required />
      <p class="error-msg" id="email-err">Please enter a valid email address.</p>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••"
             autocomplete="current-password" required />
      <p class="error-msg" id="password-err">Password is required.</p>
    </div>

    <button type="submit" class="btn-login" id="login-btn">
      <div class="spinner"></div>
      <span class="btn-text">Sign In</span>
    </button>
  </form>

  <p class="footer-note">HireFlow &copy; 2026 · HireFlow v1.0</p>
</div>

<script>
  const form     = document.getElementById('login-form');
  const emailEl  = document.getElementById('email');
  const passEl   = document.getElementById('password');
  const btn      = document.getElementById('login-btn');
  const errorBox = document.getElementById('login-error');
  const errorTxt = document.getElementById('login-error-text');

  function showError(msg) {
    errorTxt.textContent = msg;
    errorBox.style.display = 'flex';
  }

  function clearError() {
    errorBox.style.display = 'none';
  }

  function setLoading(on) {
    btn.disabled = on;
    btn.classList.toggle('loading', on);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    // Client-side validation
    let valid = true;

    const emailVal = emailEl.value.trim();
    const passVal  = passEl.value;

    if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
      emailEl.classList.add('error');
      document.getElementById('email-err').classList.add('visible');
      valid = false;
    } else {
      emailEl.classList.remove('error');
      document.getElementById('email-err').classList.remove('visible');
    }

    if (!passVal) {
      passEl.classList.add('error');
      document.getElementById('password-err').classList.add('visible');
      valid = false;
    } else {
      passEl.classList.remove('error');
      document.getElementById('password-err').classList.remove('visible');
    }

    if (!valid) return;

    setLoading(true);

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',   // Receive httpOnly cookies
        body: JSON.stringify({ email: emailVal, password: passVal }),
      });

      if (res.ok) {
        const data = await res.json();
        // Store access token in memory for Authorization header use
        sessionStorage.setItem('shyfthatch_token', data.access_token);
        sessionStorage.setItem('shyfthatch_expires', Date.now() + data.expires_in * 1000);
        // Redirect to main app
        window.location.href = '/';
      } else {
        const data = await res.json().catch(() => ({}));
        showError(data.detail || 'Incorrect email or password. Please try again.');
        passEl.value = '';
        passEl.focus();
      }
    } catch {
      showError('Unable to connect to the server. Please check your network and try again.');
    } finally {
      setLoading(false);
    }
  });

  // Clear field errors on input
  emailEl.addEventListener('input', () => {
    emailEl.classList.remove('error');
    document.getElementById('email-err').classList.remove('visible');
    clearError();
  });
  passEl.addEventListener('input', () => {
    passEl.classList.remove('error');
    document.getElementById('password-err').classList.remove('visible');
    clearError();
  });
</script>
</body>
</html>
